<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IIIF Annotation Test</title>

<link rel="stylesheet"
  href="https://unpkg.com/mirador@latest/dist/css/mirador-combined.min.css">

<script src="https://unpkg.com/mirador@latest/dist/mirador.min.js"></script>

<script src= "https://cdn.jsdelivr.net/npm/@recogito/annotorious@2.7.10/dist/annotorious.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@recogito/annotorious@2.7.10/dist/annotorious.min.css"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

#viewer {
  width: 100%;
  height: 100vh;
}
</style>
</head>

<body>
<div id="viewer"></div>

<script>
Mirador.viewer({
  id: "viewer",

  windows: [
    {
      manifestId: "manifest.json",
      canvasId: "canvas-1"
    },
    {
      manifestId: "manifest.json",
      canvasId: "canvas-2"
    }
  ],

  workspace: {
    type: 'mosaic'
  },

  annotations: {
    visible: true
  }
});
</script>

</body>
</html>
